<title>01 Roles (speaker to side)</title>
<style>
.rw{position:absolute;left:-330px;width:660px;height:84px;display:flex;align-items:center;gap:24px;font-size:38px;font-weight:500;white-space:nowrap}
.rw .ib{width:56px;height:56px;border-radius:14px;background:var(--inset);display:flex;align-items:center;justify-content:center;flex:none}
#hl{position:absolute;left:-346px;width:692px;border-radius:18px;background:var(--accentSoft);box-shadow:inset 0 0 0 1.5px var(--accent)}
</style>
<div data-slot="shape">
  <div class="L" id="Lpill"><div class="row disp" style="transform:translate(-50%,-50%);gap:22px;font-size:54px;font-weight:600;letter-spacing:-.02em;color:#fff"><span id="icP"></span>Product designer</div></div>
  <div class="L" id="Llist">
    <div class="a micro" style="left:-330px;top:44px">What I do</div>
    <div id="hl"></div>
    <div class="rw" id="r0" style="top:92px"><span class="ib"></span><span class="tx">Product designer</span></div>
    <div class="rw" id="r1" style="top:192px"><span class="ib"></span><span class="tx">Software engineer</span></div>
    <div class="rw" id="r2" style="top:292px"><span class="ib"></span><span class="tx">Workflow automation</span></div>
  </div>
</div><!--/shape-->
<script>
const $=id=>document.getElementById(id); const C=Object.assign({accent:'#FF5A1F',surface:'#FFFFFF',canvas:'#E9E7E2',inset:'#F1EFEB',ink:'#0B0B0B',muted:'#8A8782'},window.BRAND);
$('icP').innerHTML=M.icon('pencil',50,'#fff',2.4);
const IC=['pencil','terminal','workflow'];
// clip in = 4.10. product .48, software 1.52, workflow 3.78, specialist 5.46
const RT=[1.52,1.62,3.78], OUT=5.85;
const top0=r=>92+r*100-8, bot0=r=>92+r*100+84+8;
const hT=M.track(top0(1),[[3.78,top0(2),M.SLOW]]), hB=M.track(bot0(1),[[3.78,bot0(2),M.FAST]]);
M.scene({
  W:2560,H:1440,bg:C.canvas,T:6.2,intro:0.4,center:[780,720],
  SH:{pill:{w:640,h:132,r:66,bg:C.accent,cam:1.75}, list2:{w:780,h:320,r:30,bg:C.surface,cam:1.7}, list:{w:780,h:420,r:30,bg:C.surface,cam:1.62}},
  start:'pill', SEQ:[[1.52,'list2'],[3.78,'list']],
  speaker:{src:'../work/frames/01/', fps:60, focus:'auto', start:'full',
           boxes:{side:[1560,110,900,1220,40]}, SEQ:[[0.05,'side'],[OUT,'full']], shadow:'0 30px 80px -20px rgba(0,0,0,.7)'},
  layers:[
    {el:'Lpill',tin:null,tout:1.52},
    {el:'Llist',tin:1.52,tout:null,anchor:'t',o:{din:0.02,lin:0.22},update:(t)=>{
      const act=t<3.78?1:2;
      for(let i=0;i<3;i++){
        const e=$('r'+i), v=i===0?{o:1,blur:0,a:1}:M.vis(t,RT[i],null,{din:0.02,lin:0.22});
        e.style.opacity=v.o; e.style.filter=v.blur>0.05?`blur(${v.blur}px)`:'none'; e.style.transform=`translateY(${(1-v.a)*14}px)`;
        const on=i===act; e.style.color=on?C.ink:C.muted;
        const ib=e.querySelector('.ib'); const key=on?'on':'off';
        if(ib._k!==key){ib.innerHTML=M.icon(IC[i],30,on?'#fff':C.muted,2.2); ib.style.background=on?C.accent:C.inset; ib._k=key;}
      }
      const hs=$('hl').style; hs.top=hT(t)+'px'; hs.height=Math.max(0,hB(t)-hT(t))+'px'; hs.opacity=M.vis(t,1.52,null,{din:0.12,lin:0.25}).o;
    }},
  ],
  extra:(t)=>{ document.getElementById('world').style.opacity=1-M.eo((t-OUT)/0.3); },
});
</script>
