<title>01 Roles</title>
<style>
.rw{position:absolute;left:-330px;width:660px;height:84px;display:flex;align-items:center;gap:24px;font-size:38px;font-weight:500;white-space:nowrap}
.rw .ib{width:56px;height:56px;border-radius:14px;background:#1E2433;display:flex;align-items:center;justify-content:center;flex:none}
#hl{position:absolute;left:-346px;width:692px;border-radius:18px;background:rgba(99,102,241,.18);box-shadow:inset 0 0 0 1.5px rgba(99,102,241,.55)}
</style>
<div data-slot="shape">
  <div class="L" id="Lpill"><div class="row disp" style="transform:translate(-50%,-50%);gap:22px;font-size:54px;font-weight:600;letter-spacing:-.02em;color:#fff"><span id="icP"></span>Product designer</div></div>
  <div class="L" id="Llist">
    <div class="a micro" style="left:-330px;top:44px">What I do</div>
    <div id="hl"></div>
    <div class="rw" id="r0" style="top:92px"><span class="ib"></span><span class="tx">Product designer</span></div>
    <div class="rw" id="r1" style="top:192px"><span class="ib"></span><span class="tx">Software engineer</span></div>
    <div class="rw" id="r2" style="top:292px"><span class="ib"></span><span class="tx">Workflow automation</span></div>
  </div>
</div><!--/shape-->
<script>
const $=id=>document.getElementById(id);
$('icP').innerHTML=M.icon('pencil',50,'#fff',2.4);
const IC=['pencil','terminal','workflow'];
// row appear times (clip-local): software 1.32, workflow 3.58
const RT=[1.32,1.42,3.58];
const ACT=[[1.32,1],[3.58,2]];
const top0=r=>92+r*100-8, bot0=r=>92+r*100+84+8;
const hT=M.track(top0(1),[[3.58,top0(2),M.SLOW]]), hB=M.track(bot0(1),[[3.58,bot0(2),M.FAST]]);
M.scene({
  W:2560,H:1440,bg:'#0F1117',T:5.9,intro:0.05,
  SH:{pill:{w:640,h:132,r:66,bg:'#6366F1',cam:2.05}, list2:{w:780,h:320,r:30,bg:'#141824',cam:2.1}, list:{w:780,h:420,r:30,bg:'#141824',cam:2.0}},
  start:'pill', SEQ:[[1.32,'list2'],[3.58,'list']],
  layers:[
    {el:'Lpill',tin:null,tout:1.32},
    {el:'Llist',tin:1.32,tout:null,anchor:'t',o:{din:0.02,lin:0.22},update:(t)=>{
      const act=t<3.58?1:2;
      for(let i=0;i<3;i++){
        const e=$('r'+i), v=i===0?{o:1,blur:0,a:1}:M.vis(t,RT[i],null,{din:0.02,lin:0.22});
        e.style.opacity=v.o; e.style.filter=v.blur>0.05?`blur(${v.blur}px)`:'none'; e.style.transform=`translateY(${(1-v.a)*14}px)`;
        const on=i===act;
        e.style.color=on?'#F8FAFC':'#94A3B8';
        const ib=e.querySelector('.ib'); const key=on?'on':'off';
        if(ib._k!==key){ib.innerHTML=M.icon(IC[i],30,on?'#fff':'#94A3B8',2.2); ib.style.background=on?'#6366F1':'#1E2433'; ib._k=key;}
      }
      const hs=$('hl').style; hs.top=hT(t)+'px'; hs.height=Math.max(0,hB(t)-hT(t))+'px';
      const hv=M.vis(t,1.32,null,{din:0.12,lin:0.25}); hs.opacity=hv.o;
    }},
  ],
});
</script>
