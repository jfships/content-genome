<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1920, height=1080"><script src="shared/gsap.min.js"></script><link rel="stylesheet" href="shared/base.css"><style>
#row{position:absolute;left:0;top:0;width:6000px;height:1080px}
.lab{position:absolute;top:110px;font-size:52px}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="6">
 <div id="row"><div class="scr wp" style="left:360px;top:200px;width:1200px;height:700px"><img src="assets/screen-1.png"></div><div class="scr wp" style="left:1860px;top:200px;width:1200px;height:700px"><img src="assets/screen-2.png"></div><div class="scr wp" style="left:3360px;top:200px;width:1200px;height:700px"><img src="assets/screen-3.png"></div>
  <div class="h lab" style="left:360px">Brand</div><div class="h lab" style="left:1860px">Idea</div><div class="h lab" style="left:3360px">Plan</div></div>
</div>
<script>
const tl=gsap.timeline({paused:true});
tl.fromTo("#row",{opacity:0},{opacity:1,duration:.4},0);
[1,2].forEach((k,i)=>{const t=1.4+i*1.8;
  tl.to("#row",{x:-1500*k,duration:.42,ease:"power4.inOut"},t);
  tl.to(".wp img",{filter:"blur(28px)",duration:.21,ease:"power2.in"},t).to(".wp img",{filter:"blur(0px)",duration:.21,ease:"power2.out"},t+.21);
  tl.to(".wp",{scaleX:1.08,duration:.21},t).to(".wp",{scaleX:1,duration:.21},t+.21);});
window.__timelines["main"]=tl;
</script></body></html>
