<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1920, height=1080"><script src="shared/gsap.min.js"></script><link rel="stylesheet" href="shared/base.css"><style>
.fr{position:absolute;left:50%;top:50%;border:4px solid rgba(214,223,234,.35);box-sizing:border-box}
#scr{position:absolute;left:660px;top:340px;width:600px;height:375px}
#w{position:absolute;left:0;right:0;top:80px;text-align:center;font-size:62px}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="5">
 <div id="frames"></div>
 <div class="scr" id="scr"><img src="assets/screen-1.png"></div>
 <div id="w" class="h">Wait. <span class="blk">That's the Whole Brand?</span></div>
</div>
<script>
const F=document.getElementById("frames");const N=9;
for(let i=0;i<N;i++){const d=document.createElement("div");d.className="fr";const w=700+i*260,h=440+i*160;d.style.width=w+"px";d.style.height=h+"px";d.style.marginLeft=-w/2+"px";d.style.marginTop=-h/2+"px";if(i%3==1)d.style.borderColor="rgba(255,122,26,.7)";F.appendChild(d);}
const tl=gsap.timeline({paused:true}); gsap.set("#w",{opacity:0});
tl.fromTo("#scr",{scale:.7,opacity:0},{scale:1,opacity:1,duration:.7,ease:"expo.out"},0);
tl.fromTo(".fr",{scale:.35,opacity:0},{scale:1,opacity:1,duration:.8,ease:"expo.out",stagger:.03},0.1);
// dolly zoom: frames rush outward (space stretches) while the screen holds
tl.to(".fr",{scale:2.6,duration:2.2,ease:"power2.inOut",stagger:{each:.02,from:"end"}},1.1);
tl.to("#scr",{scale:1.05,duration:2.2,ease:"power2.inOut"},1.1);
tl.fromTo("#w",{opacity:0,scale:1.3},{opacity:1,scale:1,duration:.3,ease:"power3.out",immediateRender:false},3.3);
window.__timelines["main"]=tl;
</script></body></html>
