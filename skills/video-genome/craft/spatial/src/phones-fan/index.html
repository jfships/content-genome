<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1920, height=1080"><script src="shared/gsap.min.js"></script><link rel="stylesheet" href="shared/base.css"><style>
.stage{perspective:1800px;perspective-origin:50% 45%}
.ph{position:absolute;left:810px;top:250px;width:300px;height:620px;border-radius:44px;background:#0b1b30;padding:12px;box-shadow:0 50px 120px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.2);transform-origin:50% 120%}
.ph img{width:100%;height:100%;object-fit:cover;object-position:left top;border-radius:32px;display:block}
.ph .lb{position:absolute;left:0;right:0;bottom:-70px;text-align:center;font-size:32px}
#cap{position:absolute;left:0;right:0;top:70px;text-align:center;font-size:58px}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="6">
 <div class="stage"><div class="w3">
  <div class="ph" id="p0"><img src="assets/screen-1.png"><div class="h lb">Shorts</div></div>
  <div class="ph" id="p2"><img src="assets/screen-2.png"><div class="h lb">Ideas</div></div>
  <div class="ph" id="p1"><img src="assets/video-frame.jpg"><div class="h lb">Reels</div></div>
 </div></div>
 <div id="cap" class="h">Every Format, <span class="blk">One Brand</span></div>
</div>
<script>
const tl=gsap.timeline({paused:true});
gsap.set(".lb,#cap",{opacity:0});
tl.fromTo([".ph"],{y:500,rotationX:30,opacity:0},{y:0,rotationX:0,opacity:1,duration:1.1,ease:"expo.out",stagger:.08},0);
tl.to("#p0",{rotation:-16,x:-330,z:-120,rotationY:18,duration:1.0,ease:"power3.inOut"},1.2);
tl.to("#p2",{rotation:16,x:330,z:-120,rotationY:-18,duration:1.0,ease:"power3.inOut"},1.25);
tl.to("#p1",{z:120,y:-20,duration:1.0,ease:"power3.inOut"},1.3);
tl.to(".lb",{opacity:1,duration:.4,stagger:.1},2.2);
tl.fromTo("#cap",{opacity:0,y:20},{opacity:1,y:0,duration:.5,ease:"power3.out",immediateRender:false},2.6);
tl.to(".ph img",{filter:"brightness(1.12)",duration:.3},3.4).to(".ph img",{filter:"brightness(1)",duration:.3},3.7);
window.__timelines["main"]=tl;
</script></body></html>
