<script>
const tl=gsap.timeline({paused:true});
gsap.set("#grid",{rotationX:72,transformOrigin:"50% 0%"}); gsap.set(["#cap","#beam","#card"],{opacity:0});
tl.fromTo("#grid",{rotationX:80,y:120},{rotationX:72,y:0,duration:1.2,ease:"expo.out"},0);
// tiles ripple outward from the opening as the card rises
document.querySelectorAll(".t").forEach(t=>{const r=+t.dataset.r,c=+t.dataset.c;const d=Math.hypot(c-4,(r-2.5)*1.3);
  tl.to(t,{z:-40-20*Math.max(0,4-d),duration:.5,ease:"power3.out"},1.3+d*.06);
  tl.to(t.querySelector("img"),{filter:"brightness(.4)",duration:.5},1.3+d*.06);});
tl.fromTo("#beam",{opacity:0,scaleY:.3,transformOrigin:"50% 100%"},{opacity:1,scaleY:1,duration:.9,ease:"power3.out",immediateRender:false},1.2);
tl.fromTo("#card",{y:560,z:-420,rotationX:72,scale:.6,opacity:0},{y:0,z:0,rotationX:0,scale:1,opacity:1,duration:1.5,ease:"expo.out",immediateRender:false},1.5);
tl.fromTo("#card",{rotationY:-14},{rotationY:0,duration:1.0,ease:"power3.inOut",immediateRender:false},3.0);
tl.fromTo("#cap",{opacity:0,y:20},{opacity:1,y:0,duration:.5,ease:"power3.out",immediateRender:false},3.4);
window.__timelines["main"]=tl;
</script></body></html>
