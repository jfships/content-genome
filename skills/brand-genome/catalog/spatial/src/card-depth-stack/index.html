<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1920, height=1080"><script src="shared/gsap.min.js"></script><link rel="stylesheet" href="shared/base.css"><style>
.stage{perspective:1400px;perspective-origin:50% 40%}
.cd{position:absolute;left:560px;top:260px;width:800px;height:500px}
#cap{position:absolute;left:120px;top:80px;font-size:54px}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="6">
 <div class="stage"><div class="w3" id="w">
  <div class="scr cd" id="d4"><img src="assets/screen-1.png"></div>
  <div class="scr cd" id="d3"><img src="assets/screen-2.png"></div>
  <div class="scr cd" id="d2"><img src="assets/screen-3.png"></div>
  <div class="scr cd" id="d1"><img src="assets/screen-4.png"></div>
 </div></div>
 <div id="cap" class="h">Layer by <span class="blk">Layer</span></div>
</div>
<script>
const tl=gsap.timeline({paused:true}); gsap.set("#cap",{opacity:0});
const D=["#d1","#d2","#d3","#d4"];
D.forEach((d,i)=>gsap.set(d,{z:-i*260,y:-i*40,x:i*60,filter:`blur(${i*3}px) brightness(${1-i*.12})`}));
tl.fromTo("#w",{rotationY:-24,rotationX:10,z:-500},{rotationY:-14,rotationX:6,z:0,duration:1.2,ease:"expo.out"},0);
tl.fromTo("#cap",{opacity:0,y:20},{opacity:1,y:0,duration:.5,ease:"power3.out",immediateRender:false},.6);
// peel the front card away, focus moves one layer back each beat
for(let k=0;k<3;k++){const t=1.6+k*1.2;
  tl.to(D[k],{x:"-=900",z:"+=200",rotationY:-30,opacity:0,duration:.7,ease:"power3.in"},t);
  for(let j=k+1;j<4;j++) tl.to(D[j],{z:-(j-k-1)*260,y:-(j-k-1)*40,x:(j-k-1)*60,filter:`blur(${(j-k-1)*3}px) brightness(${1-(j-k-1)*.12})`,duration:.8,ease:"power3.out"},t+.25);
}
window.__timelines["main"]=tl;
</script></body></html>
