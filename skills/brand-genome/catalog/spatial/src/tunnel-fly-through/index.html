<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1920, height=1080">
<script src="shared/gsap.min.js"></script><link rel="stylesheet" href="shared/base.css">
<style>
.stage{perspective:1000px;perspective-origin:50% 50%}
#end{position:absolute;left:700px;top:270px;width:520px;height:540px;border-radius:40px;background:#0b1b30;padding:12px;box-shadow:0 0 120px rgba(255,122,26,.45)}
#end img{width:100%;height:100%;object-fit:cover;border-radius:30px}
#cap{position:absolute;left:0;right:0;bottom:90px;text-align:center;font-size:58px}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="6">
 <div class="stage"><div class="w3" id="cam"><div class="scr p" data-z="0" data-side="L" style="left:-260px;top:210px;width:880px;height:660px"><img src="assets/screen-1.png"></div><div class="scr p" data-z="0" data-side="R" style="left:1300px;top:210px;width:880px;height:660px"><img src="assets/screen-2.png"></div><div class="scr p" data-z="-700" data-side="L" style="left:-260px;top:150px;width:880px;height:660px"><img src="assets/screen-3.png"></div><div class="scr p" data-z="-700" data-side="R" style="left:1300px;top:150px;width:880px;height:660px"><img src="assets/screen-4.png"></div><div class="scr p" data-z="-1400" data-side="L" style="left:-260px;top:210px;width:880px;height:660px"><img src="assets/screen-5.png"></div><div class="scr p" data-z="-1400" data-side="R" style="left:1300px;top:210px;width:880px;height:660px"><img src="assets/screen-6.png"></div><div class="scr p" data-z="-2100" data-side="L" style="left:-260px;top:150px;width:880px;height:660px"><img src="assets/screen-7.png"></div><div class="scr p" data-z="-2100" data-side="R" style="left:1300px;top:150px;width:880px;height:660px"><img src="assets/screen-8.png"></div><div class="scr p" data-z="-2800" data-side="L" style="left:-260px;top:210px;width:880px;height:660px"><img src="assets/screen-9.png"></div><div class="scr p" data-z="-2800" data-side="R" style="left:1300px;top:210px;width:880px;height:660px"><img src="assets/screen-10.png"></div><div class="scr p" data-z="-3500" data-side="L" style="left:-260px;top:150px;width:880px;height:660px"><img src="assets/screen-1.png"></div><div class="scr p" data-z="-3500" data-side="R" style="left:1300px;top:150px;width:880px;height:660px"><img src="assets/screen-2.png"></div><div class="scr p" data-z="-4200" data-side="L" style="left:-260px;top:210px;width:880px;height:660px"><img src="assets/screen-3.png"></div><div class="scr p" data-z="-4200" data-side="R" style="left:1300px;top:210px;width:880px;height:660px"><img src="assets/screen-4.png"></div><div id="end"><img src="assets/video-frame.jpg"></div></div></div>
 <div id="cap" class="h">Every Decision, <span class="blk">One Video.</span></div>
</div>
<script>
const tl=gsap.timeline({paused:true});
document.querySelectorAll(".p").forEach(p=>gsap.set(p,{z:+p.dataset.z,rotationY:p.dataset.side=="L"?72:-72}));
gsap.set("#end",{z:-5200}); gsap.set("#cap",{opacity:0});
tl.fromTo("#cam",{z:-400},{z:4700,duration:4.6,ease:"power2.inOut"},0.2);
// motion blur on the walls while the camera is fastest
tl.to(".p img",{filter:"blur(6px)",duration:.8,ease:"power2.in"},1.4).to(".p img",{filter:"blur(0px)",duration:.8,ease:"power2.out"},3.4);
tl.fromTo("#cap",{opacity:0,y:20},{opacity:1,y:0,duration:.5,ease:"power3.out",immediateRender:false},4.7);
window.__timelines["main"]=tl;
</script></body></html>
