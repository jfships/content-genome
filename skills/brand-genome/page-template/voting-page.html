<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__TITLE__</title>
<style>__FONTS__</style>
<style>
/* brand-genome voting page template. Neutral on purpose: the option is the only color on the page. */
:root{
  --bg:#ececec; --card:#fff; --ink:#1a1a1a; --mute:#6b6b6b; --line:#d9d9d9;
  --btn:#f3f3f3; --btn-ink:#1a1a1a; --on:#1a1a1a; --on-ink:#fff;
  --r:10px; --gap:16px; --max:1180px;
  /* page-type colors: the same everywhere */
  --pick:#1d4ed8; --fin:#b45309; --lib:#15803d; --chk:#0e7490;
}
:root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
  --bg:#1c1c1c; --card:#262626; --ink:#f2f2f2; --mute:#a3a3a3; --line:#3a3a3a;
  --btn:#333; --btn-ink:#f2f2f2; --on:#f2f2f2; --on-ink:#1a1a1a;
}}
:root[data-theme="dark"]{
  --bg:#1c1c1c; --card:#262626; --ink:#f2f2f2; --mute:#a3a3a3; --line:#3a3a3a;
  --btn:#333; --btn-ink:#f2f2f2; --on:#f2f2f2; --on-ink:#1a1a1a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--max);margin:0 auto;padding:22px 16px 80px}
.credit{margin:32px 0 0;font-size:12.5px;color:var(--mute)}.credit a{color:inherit}
/* header band: journey strip → stage + step progress + page-type badge → title → one line */
header{margin:0 0 22px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px 18px;--k:var(--pick)}
header.k-finalists{--k:var(--fin)} header.k-library{--k:var(--lib)} header.k-adjust{--k:var(--chk)}
.journey{display:flex;gap:3px;margin:0 0 12px}
.journey span{flex:1;min-width:0;height:22px;border-radius:4px;background:var(--btn);color:var(--mute);font-size:11px;line-height:22px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.journey span.done{background:var(--ink);color:var(--card)}
.journey span.now{background:var(--k);color:#fff;font-weight:700}
.where{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:0 0 10px}
.where .stage{font-size:22px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.where .of{font-size:13px;color:var(--mute)}
.where .pct{font-size:13px;color:var(--mute);margin-left:auto}
.where .pct.chg{color:#fff;background:#7c3aed;font-weight:600;padding:4px 10px;border-radius:99px}
.tag.cur{background:var(--ink);color:var(--card)}
.stepline{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 12px}
.dots{display:flex;gap:4px;align-items:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.dots i.done{background:var(--ink)}
.dots i.now{background:var(--k);width:22px;border-radius:5px}
.stepline .st{font-size:14px;font-weight:600}
.badge{display:inline-block;font:700 11.5px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;letter-spacing:.09em;text-transform:uppercase;background:var(--k);color:#fff;padding:6px 9px;border-radius:4px}
.persona{font-size:12.5px;color:var(--mute)}
header h1{font-size:30px;line-height:1.12;margin:0 0 6px;font-weight:750;letter-spacing:-.015em;max-width:820px}
header p.what{margin:0;max-width:720px;font-size:16.5px}
.section{margin:0 0 34px}
.shead{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.shead h2{font-size:20px;margin:0;letter-spacing:-.01em}
.shead p.sl{margin:0;color:var(--mute);font-size:14.5px;flex-basis:100%;max-width:760px}
.shead p.rl{margin:0;font-size:15px;color:var(--ink);flex-basis:100%}
.shead p.rl b{font-weight:700}
.ptag{position:absolute;right:8px;top:8px;z-index:2;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 7px;border-radius:4px;pointer-events:none}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:2px 0 6px;max-width:620px}
.slot{border:2px dashed var(--line);border-radius:var(--r);padding:8px;display:flex;gap:10px;align-items:center;min-height:70px;background:var(--card)}
.slot.full{border-style:solid;border-color:var(--pick)}
.slot .sth{width:96px;height:54px;flex:0 0 96px;border-radius:5px;overflow:hidden;background:var(--btn);position:relative}
.slot .sth .scale{position:absolute;left:0;top:0;width:320px;height:180px;transform:scale(.3);transform-origin:0 0}
.slot .sth img{width:100%;height:100%;object-fit:cover;display:block}
.slot .sl1{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--pick)}
.slot .sl2{font-size:14.5px;font-weight:600}
.slot:not(.full) .sl2{color:var(--mute);font-weight:400}
.swapnote{font-size:13.5px;color:var(--pick);font-weight:600;min-height:1.3em;margin:0}
.cbadge{position:absolute;left:8px;top:8px;z-index:3;background:var(--pick);color:#fff;font:700 11px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;letter-spacing:.08em;padding:6px 8px;border-radius:4px}
.cbadge.bk{background:var(--card);color:var(--pick);box-shadow:inset 0 0 0 2px var(--pick)}
.rule{display:inline-block;font:600 11px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:5px 8px;border-radius:4px;vertical-align:middle;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:var(--gap)}
.tiles .grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.one .grid{grid-template-columns:1fr}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;position:relative}
.card.kept{border-color:var(--ink)}
.card.chosen{outline:3px solid var(--pick);outline-offset:-3px}
.card.kept.lib{outline:2px solid var(--lib);outline-offset:-2px;border-color:var(--lib)}
.card.kept.fin{outline:2px solid var(--fin);outline-offset:-2px;border-color:var(--fin)}
.card.backup{outline:2px dashed var(--pick);outline-offset:-2px}
.card.rejected{border-style:dashed;border-color:var(--mute)}
.card.rejected .body{background:var(--btn)}
.tag.disc{color:var(--mute);border-color:var(--mute);border-style:dashed}
/* a no-all-caps house rule (houseRules.noAllCaps) reaches the page's own labels too */
html.no-caps *{text-transform:none!important;letter-spacing:normal!important}
.media{display:grid;gap:2px;background:#000;cursor:zoom-in;position:relative}
.media.n1{grid-template-columns:1fr}
.media.n2{grid-template-columns:1fr 1fr}
.media.n3{grid-template-columns:1fr 1fr}
.media.n3 .m:first-child{grid-column:1/3}
.m{position:relative;overflow:hidden;background:#111;aspect-ratio:16/9;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.m.a21{aspect-ratio:2/1}.m.a916{aspect-ratio:9/16}.m.a11{aspect-ratio:1/1}
.m img{width:100%;height:100%;object-fit:cover;display:block}
.m .ov{position:absolute;inset:0;pointer-events:none}
.m .html{position:absolute;inset:0}
.lab{position:absolute;left:6px;bottom:6px;z-index:2;background:rgba(0,0,0,.6);color:#fff;font-size:11.5px;padding:2px 7px;border-radius:4px}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;width:68px;height:68px;border:0;border-radius:50%;background:rgba(0,0,0,.72);color:#fff;font-size:26px;line-height:68px;text-align:center;cursor:pointer;box-shadow:0 0 0 3px rgba(255,255,255,.85);padding:0}
.play:hover{background:rgba(0,0,0,.88)}
.card.playing .play{opacity:.28}
.card.playing .play:hover{opacity:.9}
.sw{display:flex;height:34px}
.sw span{flex:1;position:relative;box-shadow:inset 0 0 0 1px rgba(127,127,127,.35)}
.sw span i{display:none}
.legend{margin:0;color:var(--mute);font-size:13px;flex-basis:100%}
.legend b{color:var(--ink);font-weight:600}
.body{padding:10px 12px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
.tiles .body{padding:8px 10px 9px;gap:5px}
.name{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.name b{font-size:16px}
.tiles .name b{font-size:14.5px}
.tag{font-size:11px;font-weight:600;color:var(--ink);border:1px solid var(--ink);border-radius:99px;padding:1px 8px;white-space:nowrap}
.line{margin:0;color:var(--mute);font-size:13.5px;line-height:1.35}
.line:empty{display:none}
.tiles .line{font-size:12.5px}
.why{margin:0;font-size:13.5px}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px;align-items:center}
.btns button{border:1px solid var(--line);background:var(--btn);color:var(--btn-ink);border-radius:99px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
.btns button.keep{border-color:var(--ink)}
.btns button:hover{border-color:var(--ink)}
.btns button.on{background:var(--on);color:var(--on-ink);border-color:var(--on)}
.btns button.on.v-pick{background:var(--pick);border-color:var(--pick);color:#fff}
.btns button.on.v-backup{background:var(--card);color:var(--pick);border-color:var(--pick);box-shadow:inset 0 0 0 1px var(--pick)}
.btns button.on.v-keep,.btns button.on.v-accent{background:var(--lib);border-color:var(--lib);color:#fff}
.btns button.on.v-yes{background:var(--fin);border-color:var(--fin);color:#fff}
.btns button.on.v-alt{background:var(--ink);border-color:var(--ink);color:var(--card)}
.btns button.on.v-no{background:var(--card);color:var(--ink);border-color:var(--ink);border-style:dashed}
.tiles .btns button{font-size:12.5px;padding:4px 9px}
.btns .mv{margin-left:auto;font-size:12.5px;color:var(--mute);text-decoration:underline;cursor:pointer;white-space:nowrap}
.hint{font-size:13px;color:var(--ink);min-height:1.2em}
.notewrap{display:flex;visibility:hidden;flex-direction:column;gap:6px}
.card.answered .notewrap{visibility:visible}
.notewrap a{font-size:12.5px;color:var(--mute);cursor:pointer;text-decoration:underline;align-self:flex-start}
.notewrap textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit;font-size:14px;background:var(--card);color:var(--ink);resize:vertical;display:none}
.notewrap.open textarea{display:block}
.notewrap.open a{display:none}
.note-q{font-size:13px;color:var(--ink);font-style:italic;margin:0}
.note-q:before{content:'\201C'}.note-q:after{content:'\201D'}
.trim{font-size:12.5px;color:var(--mute);margin:-6px 0 12px}
.trim:empty{display:none}
footer{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding:0 16px}
footer .in{max-width:var(--max);margin:0 auto;padding:9px 0 10px;display:flex;gap:14px;align-items:center;justify-content:space-between}
footer .bb{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:14px;line-height:1.35}
footer .bb span{overflow:hidden;text-overflow:ellipsis}
footer .bb .b1{color:var(--mute)}
footer .bb .b2 b{font-weight:700}
footer .bb .b2 .saved{color:var(--mute)}
footer .bb .b3 b{font-weight:700}
footer button{border:1px solid var(--line);background:var(--btn);color:var(--btn-ink);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap;display:none;flex:0 0 auto}
footer button.show{display:inline-block}
.wrap{padding-bottom:120px}
.locked{margin:0 0 18px;background:var(--ink);color:var(--card);border-radius:var(--r);padding:12px 16px;font-size:16px;font-weight:700}
body.is-locked .btns button,body.is-locked .notewrap,body.is-locked .mv,body.is-locked .set .use,body.is-locked .set select{pointer-events:none;opacity:.55}
.alts{margin:4px 0 10px}
.alts .al1{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 0 6px}
.alts .row{display:flex;flex-wrap:wrap;gap:8px}
.alts .at{width:86px}
.alts .at .sq{width:86px;height:86px;border-radius:6px;overflow:hidden;position:relative;background:var(--btn);border:1px solid var(--line)}
.alts .at .sq .scale{position:absolute;left:50%;top:0;width:320px;height:180px;transform:translateX(-50%) scale(.48);transform-origin:50% 0}
.alts .at .sq img{width:100%;height:100%;object-fit:cover;display:block}
.alts .at span{display:block;font-size:12px;line-height:1.2;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alts .none{font-size:13.5px;color:var(--mute)}
.slots.big{max-width:760px}
.slots.big .slot{min-height:110px}
.slots.big .sth{width:176px;height:99px;flex:0 0 176px}
.slots.big .sth .scale{transform:scale(.55)}
.secpick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex-basis:100%}
.secpick .lbl{font-size:13.5px;color:var(--mute);margin-right:4px}
.secpick button{border:1px solid var(--line);background:var(--btn);color:var(--btn-ink);border-radius:99px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}
.secpick button.on{background:var(--pick);border-color:var(--pick);color:#fff}
.secpick button.on.v-backup{background:var(--card);color:var(--pick);box-shadow:inset 0 0 0 1px var(--pick)}
.secpick button.on.v-alt{background:var(--ink);border-color:var(--ink);color:var(--card)}
.secpick .playall{border-color:var(--ink);font-weight:600}
#lb{position:fixed;inset:0;background:#000;display:none;z-index:50;padding:16px;cursor:zoom-out;overflow:auto}
#lb.open{display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center}
#lb .m{width:min(100%,1100px);background:#000;flex:0 0 auto}
#lb .m img{width:100%;height:100%;object-fit:contain}
#lb .cap{color:#fff;font-size:15px}
/* set builder */
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:var(--gap)}
.set{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.set.on{outline:2px solid var(--ink);outline-offset:-2px}
.set .prev{position:relative;aspect-ratio:16/9;background:#111;overflow:hidden}
.set .prev img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.set .prev .ov2{position:absolute;inset:0}
.set .body{padding:10px 12px 12px;gap:8px}
.set .picks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.set .picks label{font-size:11.5px;color:var(--mute);display:flex;flex-direction:column;gap:3px}
.set .picks select{font:inherit;font-size:13px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--btn);color:var(--ink);max-width:100%}
.set .picks .rs{font-size:11.5px;color:var(--mute);text-decoration:underline;cursor:pointer;visibility:hidden;align-self:flex-start}
.set .picks .rs.show{visibility:visible}
.set .row{display:flex;gap:10px;align-items:center}
.set .rset{font-size:13px;color:var(--mute);text-decoration:underline;cursor:pointer;background:none;border:0;padding:0;font-family:inherit}
.set .use{align-self:flex-start;border:1px solid var(--ink);background:var(--btn);color:var(--btn-ink);border-radius:99px;padding:6px 12px;font:inherit;font-size:13.5px;cursor:pointer}
.set.on .use{background:var(--on);color:var(--on-ink);border-color:var(--on)}
@media (max-width:480px){
  .grid{grid-template-columns:1fr}
  .tiles .grid{grid-template-columns:1fr 1fr;gap:10px}
  .sets{grid-template-columns:1fr}
  .set .picks{grid-template-columns:1fr}
  .set .picks label{font-size:13px}
  .btns button{padding:9px 14px;font-size:15px}
  header{padding:12px 12px 14px}
  header h1{font-size:24px}
  .journey span{font-size:0;height:8px}
  .journey span.now{font-size:10.5px;height:18px;line-height:18px;flex:3}
  .where .stage{font-size:19px}
  .slots{grid-template-columns:1fr}
  footer .in{flex-wrap:wrap}
  footer .bb{font-size:13px}
  .slots.big .sth{width:120px;height:68px;flex:0 0 120px}
  .slots.big .sth .scale{transform:scale(.375)}
}
</style>
__HEAD__

<body>
<script id="page-data" type="application/json">__DATA__</script>
<div class="wrap">
  <div class="locked" id="locked" hidden>Done. Your picks are saved. Continue in chat.</div>
  <header id="hd"></header>
  <main id="main"></main>
  <p class="credit" id="credit"></p>
</div>
<footer><div class="in">
  <div class="bb"><span class="b1" id="bb1"></span><span class="b2" id="count"></span><span class="b3" id="bb3"></span></div>
  <button id="copy" type="button">Copy answers for the chat</button>
</div></footer>
<script>
(function(){
  const D = JSON.parse(document.getElementById('page-data').textContent);
  (function(){ const c = document.getElementById('credit'); if (!c) return; if (D.credit === false) c.remove(); else c.innerHTML = 'Made with brand-genome by jfships · <a href="https://youtube.com/@jfships_ai" target="_blank" rel="noopener">youtube.com/@jfships_ai</a>'; })();
  const LS_KEY = 'bg-votes-' + D.round;
  // A page is one or more sections. A page without `sections` is one unnamed section.
  const SECTIONS = D.sections || [{id:'all', title:D.sectionTitle||'', line:'', kind:D.kind, keepWord:D.keepWord, buttons:D.buttons||[], keepValues:D.keepValues||[], single:D.single||null, singleFallback:D.singleFallback||'', altValue:D.altValue||'', layout:D.layout, aspect:D.aspect, trimAbove:D.trimAbove, options:D.options||[]}];
  // Main / Backup / Alternative pages: a finalist nobody touched counts as an Alternative (nothing is thrown away unless Discarded).
  const verdictOf = (o, s) => { const st = state[o.id]; if (st && st.verdict !== undefined && (st.verdict || st.answered_by)) return st.verdict || (s && s.altValue ? s.altValue : '');
    // change mode: a library item the creator already has starts as kept
    if (o.current && s && (s.kind || D.kind) === 'library') return (s.keepValues || [])[0] || 'keep';
    return s && s.altValue ? s.altValue : ''; };
  const ALL = [];      // votable options
  const CONTROLS = []; // reference cards, never voted on
  SECTIONS.forEach(s => s.options.forEach(o => { o._home = s.id; (o.control ? CONTROLS : ALL).push(o); }));
  // The rule line above each section's cards: what the buttons allow. A section's own `rule` overrides it.
  const RULES = {fixed:'pick one.', fixedBackup:'pick one, plus one backup.', fixedAlt:'pick a main and a backup. Every other finalist stays as an alternative unless you discard it.', library:"pick as many as you like. They'll all be added to your library.", finalists:'mark as many finalists as you like.', adjust:'say if it looks right.'};
  function ruleHtml(s, title){
    const kind = s.kind || D.kind || 'fixed';
    let r = s.rule || D.rule || (kind === 'fixed' && s.altValue ? RULES.fixedAlt : kind === 'fixed' && s.singleFallback ? RULES.fixedBackup : RULES[kind]) || '';
    if (!title) r = r.charAt(0).toUpperCase() + r.slice(1);
    return `<p class="rl">${title ? `<b>${esc(title)}:</b> ` : ''}${esc(r)}</p>`;
  }
  const state = {};        // id -> {verdict, note, answered_by, section}
  const swapNotes = {};    // section id -> the last "X is now Y" line
  let col = null;

  // ---------- header ----------
  // The band is computed by build.py from page-template/journey.json (D._journey); pages only name stage + stepId.
  const J = D._journey || null;
  const BADGE = {fixed:'Pick one', finalists:'Finalists', library:'Library', adjust:'Check'};
  if ((D.houseRules || {}).noAllCaps) document.documentElement.classList.add('no-caps');
  const pageKind = D.kind || (D.sections && D.sections[0] && D.sections[0].kind) || 'fixed';
  if (pageKind === 'fixed' && (D.altValue || (D.sections || []).some(x => x.altValue))) BADGE.fixed = 'Main + backup';
  const hd = document.getElementById('hd'); hd.className = 'k-' + pageKind;
  hd.innerHTML = (J ? `
    <div class="journey" aria-label="Your progress">${J.stages.map(st => `<span class="${st.state}" title="${esc(st.name)}">${esc(st.name)}</span>`).join('')}</div>
    <div class="where"><span class="stage">${esc(J.stageName)}</span><span class="of">Stage ${J.stageIndex} of ${J.stageCount}</span>${D.persona?`<span class="persona">Answered as ${esc(D.persona)} (demo)</span>`:''}${D.change?`<span class="pct chg">Changing only: ${esc(D.change)}. Everything else stays as it is.</span>`:`<span class="pct">About ${J.pct}% done</span>`}</div>
    <div class="stepline"><span class="dots">${Array.from({length:J.stepCount},(_,i)=>`<i class="${i+1===J.step?'now':(i+1<J.step||D.change)?'done':''}"></i>`).join('')}</span><span class="st">Step ${J.step} of ${J.stepCount}${J.part?` · page ${esc(J.part)}`:''}</span><span class="badge">${esc(D.badge||BADGE[pageKind]||'')}</span></div>`

  }
  // ---------- section picks (one page that picks a group AND builds a library, e.g. motion feel + entrances) ----------

  function secPickRow(s){

  }

  function paint(el, o, s){

  // ---------- actions ----------

        state[x.id].verdict = ''; persist(x);

        clearTimeout(swapNotes['_t'+s.id]); swapNotes['_t'+s.id] = setTimeout(() => { swapNotes[s.id] = ''; const n = document.querySelector(`.swapnote[data-sec="${s.id}"]`); if (n) n.textContent = ''; }, 6000);
      });

  }
  function move(o, to){
    const st = state[o.id] || {}; st.section = to; st.verdict = ''; st.answered_by = 'creator'; state[o.id] = st;
    persist(o); render();
    const el = document.querySelector(`.card[data-id="${o.id}"]`); if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
  }
  function saveNote(o, text, el, s){
    const st = state[o.id] || {}; st.note = text; if (!st.answered_by) st.answered_by = 'creator'; state[o.id] = st;
    paint(el, o, s); persist(o);
  }
  function keepWord(s, n){
    const kw = String(s.keepWord || D.keepWord || 'kept|kept');
    const [one, many] = kw.includes('|') ? kw.split('|') : [kw, kw];
    return n === 1 ? one : many;
  }
  function partFor(s, multi){
    // the "needs" checks moved to the chat review (e.g. "Main is missing"); the bar only reports
    const inSec = ALL.filter(o => sectionOf(o) === s.id);
    const kind = s.kind || D.kind || 'fixed';
    const pre = multi && s.title ? esc(s.short || s.title) + ': ' : '';
    if (kind === 'adjust') {
      const a = inSec.find(o => state[o.id] && state[o.id].verdict); const bd = a && s.buttons.find(x => x.value === state[a.id].verdict);
      return {text: pre + (bd ? `Answered: <b>${esc(bd.label)}</b>` : 'Not answered yet'), needs: bd ? '' : 'Answer the question first'};
    }
    if (s.single) {
      const c = inSec.find(o => state[o.id] && state[o.id].verdict === s.single);
      const extras = inSec.filter(o => state[o.id] && (s.keepValues||[]).includes(state[o.id].verdict) && state[o.id].verdict !== s.single)
        .map(o => { const bd = s.buttons.find(x => x.value === state[o.id].verdict); return `${esc(bd ? bd.label : 'Kept')}: ${esc(o.name)}`; });
      if (s.altValue) {
        const b = inSec.find(o => state[o.id] && state[o.id].verdict === s.singleFallback);
        const na = inSec.filter(o => verdictOf(o, s) === s.altValue).length, nd = inSec.filter(o => verdictOf(o, s) === 'no').length;
        return {text: pre + (c ? `Main: <b>${esc(c.name)}</b>` : 'Main: none yet') + ` · Backup: ${b ? `<b>${esc(b.name)}</b>` : 'none'} · ${na} alternative${na===1?'':'s'}${nd ? ` · ${nd} discarded` : ''}`};
      }
      return {text: pre + (c ? `Main: <b>${esc(c.name)}</b>` : 'Main: none yet') + (s.singleFallback && !extras.length ? ' · Backup: none' : '') + extras.map(x => ' · ' + x).join('')};
    }
    const n = inSec.filter(o => (s.keepValues||[]).includes(verdictOf(o, s))).length;
    const nd = inSec.filter(o => state[o.id] && state[o.id].verdict === 'no').length;
    return {text: pre + `<b>${n}</b>`, n, unit: keepWord(s, n) + (nd ? ` · ${nd} discarded` : ''), library: true};
  }
  function counts(){
    const parts = [];
    let any = false;
    const copy = document.getElementById('copy');
    if (D.mode === 'sets') {
      const chosen = state.set || null; any = !!chosen;
      parts.push(chosen ? `<b>Your set</b> · ${esc(D.slots.map(sl => `${sl.label}: ${(choice(sl.id, chosen[sl.id])||{}).name}`).join(' · '))}` : 'No set chosen yet');
    } else {
      any = ALL.some(o => state[o.id] && state[o.id].verdict);
      const multi = SECTIONS.length > 1;
      const ps = SECTIONS.map(s => partFor(s, multi));
      const libs = ps.filter(p => p.library);
      // the unit goes once, at the end, when every counted section shares one keepWord
      const shared = libs.length > 1 && libs.every(p => (SECTIONS[ps.indexOf(p)].keepWord || D.keepWord) === (SECTIONS[ps.indexOf(libs[0])].keepWord || D.keepWord));
      ps.forEach((p, i) => {
        let txt = p.text;
        if (p.library && (!shared || p === libs[libs.length - 1])) txt += ' ' + esc(p.unit);
        parts.push(txt);
      });
      const nNotes = ALL.filter(o => state[o.id] && state[o.id].note).length;
      if (nNotes) parts.push(`${nNotes} note${nNotes === 1 ? '' : 's'}`);
    }
    const live = !!copy.dataset.live;
    if (live && any) parts.push('<span class="saved">Saved</span>');
    if (D.mode === 'sectionPick' || D.sectionPick) { const m = secHolder('pick'), bk = secHolder('backup'); parts.unshift(`Main ${esc(D.sectionPick.word||'')}: ${m ? '<b>'+esc(m.title)+'</b>' : 'none yet'} · Backup: ${bk ? '<b>'+esc(bk.title)+'</b>' : 'none'}`); }
    document.getElementById('count').innerHTML = parts.join(' · ');
    copy.classList.toggle('show', any && !live && !D.locked);
    document.querySelectorAll('.trim').forEach(el => { const s = sec(el.dataset.sec); const tr = +el.dataset.trim; const n = ALL.filter(x => sectionOf(x)===s.id && state[x.id] && (s.keepValues||[]).includes(state[x.id].verdict)).length; el.textContent = n > tr ? `${n} kept. The next step is easier with ${tr} or fewer, but it's your call.` : ''; });
  }

  // ---------- lightbox ----------
  const lb = document.createElement('div'); lb.id = 'lb'; document.body.appendChild(lb);
  lb.addEventListener('click', () => lb.classList.remove('open'));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') lb.classList.remove('open'); });
  function openLb(o, s){
    const f = o.css ? `filter:${esc(o.css)}` : '';
    const ac = aspectClass(s, o) || ' a169';
    lb.innerHTML = `<div class="cap">${esc(o.name)}</div>` + (o.html
      ? `<div class="m${ac}" style="position:relative;${f}"><div class="html">${o.html}</div></div>`
      : (o.images||[]).map((src,i) => { const ov = (o.overlays && o.overlays[i]) || o.overlay; return `<div class="m${ac}" style="position:relative"><img src="${esc(src)}" alt="" style="${f}">${ov?`<div class="ov" style="${esc(ov)}"></div>`:''}${o.labels&&o.labels[i]?`<span class="lab">${esc(o.labels[i])}</span>`:''}</div>`; }).join(''))
      + `<div class="cap">Tap anywhere to close</div>`;
    lb.classList.add('open'); lb.scrollTop = 0;
  }

  // ---------- copy fallback ----------
  document.getElementById('copy').addEventListener('click', () => copyAnswers(true));
  async function copyAnswers(interactive){
    const out = ALL.map(o => { const st = state[o.id]||{}; const s = sec(sectionOf(o)); return `${o.id}\t${sectionOf(o)}\t${verdictOf(o, s)||'none'}\t${(st.note||'').replace(/\s+/g,' ')}`; }).join('\n');
    const setLine = state.set ? `\nset\t${JSON.stringify(state.set)}` : '';
    const secLine = D.sectionPick ? '\n' + SECTIONS.map(x => `_sec-${x.id}\t${x.id}\t${secState(x).verdict||''}\t`).join('\n') : '';
    const text = `round: ${D.round}\nitem\tsection\tverdict\tnote\n` + out + setLine + secLine;
    try { await navigator.clipboard.writeText(text); if (interactive) flash('Copied. Paste it in the chat.'); }
    catch(e){ if (interactive) prompt('Copy this and paste it in the chat:', text); }
  }
  function flash(msg){ const b = document.getElementById('copy'); const old = b.textContent; b.textContent = msg; setTimeout(()=>b.textContent = old, 2200); }
  function lower(s){ return String(s||'').replace(/^Your /,'your ').replace(/^For /,'for ').replace(/^[A-Z]/, c => c.toLowerCase()); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
})();
</script>
</body>
